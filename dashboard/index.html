<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 PersonalWealth - 个人资产统计</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📊 PersonalWealth</h1>
            <p>个人资产统计系统</p>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">总资产</div>
                <div class="stat-value">¥<span id="totalWealth">0.00</span></div>
                <div class="stat-subtitle">CNY</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">股票</div>
                <div class="stat-value">¥<span id="stockValue">0.00</span></div>
                <div class="stat-subtitle">含A股、美股</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">基金</div>
                <div class="stat-value">¥<span id="fundValue">0.00</span></div>
                <div class="stat-subtitle">含货币基金</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">现金</div>
                <div class="stat-value">¥<span id="cashValue">0.00</span></div>
                <div class="stat-subtitle">钱包 + 活期</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">加密</div>
                <div class="stat-value">¥<span id="cryptoValue">0.00</span></div>
                <div class="stat-subtitle">BTC + ETH</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
            <!-- Trend Chart -->
            <div class="chart-container">
                <h2>📈 资产趋势 (30天)</h2>
                <canvas id="trendChart"></canvas>
            </div>

            <!-- Distribution Charts -->
            <div class="charts-row">
                <div class="chart-container half">
                    <h2>🏦 账户分布</h2>
                    <canvas id="accountChart"></canvas>
                </div>
                <div class="chart-container half">
                    <h2>📦 资产类型分布</h2>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Assets Table -->
        <div class="table-section">
            <h2>📋 资产明细</h2>
            <table id="assetsTable" class="assets-table">
                <thead>
                    <tr>
                        <th>账户</th>
                        <th>类型</th>
                        <th>标的</th>
                        <th>数量</th>
                        <th>成本价</th>
                        <th>当前价</th>
                        <th>估值 (CNY)</th>
                        <th>盈亏</th>
                        <th>收益率</th>
                    </tr>
                </thead>
                <tbody id="assetsTableBody">
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>💡 提示: 数据由本地 SQLite 数据库提供，支持离线查看</p>
            <p>🔄 每天午夜自动更新数据快照</p>
        </footer>
    </div>

    <script src="chart.js"></script>
</body>
</html>
